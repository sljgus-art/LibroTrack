<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>📚 Mi Biblioteca</title>

<link
rel="stylesssheet"
href="stylesss.css"
>

</head>

<body>

<div class="container">

<h1>📚 Mi Biblioteca</h1>

<p class="subtitulo">
Tu biblioteca personal de lectura
</p>

<div class="formulario">

<input
id="titulo"
type="text"
placeholder="📖 Título del libro"
>

<input
id="autor"
type="text"
placeholder="✍️ Autor"
>

<input
id="isbn"
type="text"
placeholder="🔢 ISBN"
>

<button
class="btn-isbn"
onclick="iniciarEscaner()"
>
📷 Escanear ISBN
</button>

<div id="reader"></div>

<button
class="btn-isbn"
onclick="buscarISBN()"
>
🔍 Buscar ISBN
</button>

<input
id="paginas"
type="number"
placeholder="📄 Número de páginas"
>

<input
id="genero"
type="text"
placeholder="🏷️ Género"
>

<select id="estado">

<option value="pendiente">
🕒 Pendiente
</option>

<option value="leyendo">
📖 Leyendo
</option>

<option value="leido">
✅ Leído
</option>

<option value="abandonado">
❌ Abandonado
</option>

</select>

<input
id="fecha"
type="date"
>

<input
id="portada"
type="hidden"
>

<button
class="btn-primary"
onclick="agregarLibro()"
>
💾 Guardar libro
</button>

</div>

<div class="estadisticas">

<div class="tarjeta">
<span id="totalLibros">0</span>
<small>Libros</small>
</div>

<div class="tarjeta">
<span id="totalPaginas">0</span>
<small>Páginas</small>
</div>

<div class="tarjeta">
<span id="generoFavorito">-</span>
<small>Género favorito</small>
</div>

<div class="tarjeta">
<span id="autorFavorito">-</span>
<small>Autor favorito</small>
</div>

</div>

<h2>📚 Mi biblioteca</h2>

<div id="listaLibros"></div>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="app.js"></script>

<button
class="fab"
onclick="window.scrollTo({top:0,behavior:'smooth'})"
>
+
</button>

</body>

</html>
